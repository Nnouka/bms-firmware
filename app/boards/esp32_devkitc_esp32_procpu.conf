# Stage 1: BMS app on an emulated BQ76952. Bluetooth and CAN are off to keep RAM and the first
# error list small; add them back later.

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_EMUL=y

# ThingSet storage in the board's 192 kB "storage_partition" (NVS), so settings such as Wi-Fi credentials survive reboots
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_THINGSET_STORAGE=y
CONFIG_THINGSET_STORAGE_FLASH=y

CONFIG_EVENTS=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_SHELL=y
# Avoid conflicts with ThingSet ? command
CONFIG_SHELL_WILDCARD=n
# Support `select thingset` to run ThingSet requests directly
CONFIG_SHELL_CMDS_SELECT=y

CONFIG_THINGSET_SHELL=y
CONFIG_THINGSET_SHELL_REPORTING=n
CONFIG_THINGSET_SHELL_CMD_BUF_SIZE=256

# required to generate node ID in ThingSet
CONFIG_ENTROPY_GENERATOR=y

CONFIG_BMS_IC=y
CONFIG_BMS_IC_MAX_THERMISTORS=2

# Stage 2: Wi-Fi (station). Credentials are set at runtime with ThingSet (sWiFiSSID / sWiFiPSK).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_THINGSET_WIFI=y

# Stage 3: MQTT publisher (src/mqtt.c). Broker host/port/device id are set at runtime with ThingSet.
CONFIG_MQTT_LIB=y
CONFIG_SNTP=y
CONFIG_BMS_MQTT=y

# The emulated chip is fed after boot: set the SoC when its cells first appear
CONFIG_BMS_SOC_INIT_WHEN_CELLS_APPEAR=y
